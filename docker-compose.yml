# Local development stack:  docker compose up -d
#   db      PostgreSQL 16           localhost:5432  (qms / qms)
#   mailpit fake SMTP + web inbox   SMTP localhost:1025, inbox http://localhost:8025
#
# Full stack (app + worker in containers):  docker compose --profile app up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qms
      POSTGRES_PASSWORD: qms
      POSTGRES_DB: qms
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qms"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]

  app:
    profiles: [app]
    build: .
    command: ["sh", "-c", "npx prisma migrate deploy && node server.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://qms:qms@db:5432/qms?schema=public
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }

  worker:
    profiles: [app]
    build: .
    command: ["npx", "tsx", "src/worker/index.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://qms:qms@db:5432/qms?schema=public
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
