name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qms
          POSTGRES_PASSWORD: qms
          POSTGRES_DB: qms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qms" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://qms:qms@localhost:5432/qms_test?schema=public
      TEST_DATABASE_URL: postgresql://qms:qms@localhost:5432/qms_test?schema=public
      AUTH_SECRET: ci-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - name: Migrations match the schema
        run: |
          PGPASSWORD=qms psql -h localhost -U qms -d qms_test -c 'CREATE DATABASE qms_shadow'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "postgresql://qms:qms@localhost:5432/qms_shadow" --exit-code
      - run: npm run build
