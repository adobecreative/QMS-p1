name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash tests/ci/run.sh
      - run: bash tests/ci/run-node.sh
      - run: bash tests/ci/run-s3.sh
      - run: bash tests/ci/run-docker.sh
